name: CI

# PR（全ブランチ→main）と main への push で最小検証を回す。
# 壊れた main を push して Cloudflare 自動デプロイで初めて気づく事故を防ぐ。
on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチ/PR の古い run はキャンセルして無駄を省く
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 検証のみ。書き込み権限は不要
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0 # ルート package.json engines: >=22.12.0 <23
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ① ロケール parity（ja/en キー欠落を検出）
      - name: Check locale parity
        run: npm run check:locales

      # ② 型チェック（各アプリの astro check。devDependency の @astrojs/check を利用）
      - name: Type-check hub
        run: npm run astro --workspace @ttsui/hub -- check
      - name: Type-check spv
        run: npm run astro --workspace @ttsui/spv -- check

      # ③ 本番ビルド（各アプリ。Cloudflare Pages と同等の static 出力を確認）
      - name: Build hub
        run: npm run build:hub
      - name: Build spv
        run: npm run build:spv
